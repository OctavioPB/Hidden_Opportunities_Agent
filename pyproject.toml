[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", ".venv", "data", "logs", "planning", "src/ui"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length handled loosely (docstrings/tables exceed 100 often)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src", "backend", "scripts"]
omit = [
    "src/ui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
